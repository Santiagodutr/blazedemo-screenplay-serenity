serenity {
    project.name = "BlazeDemo - Automatización Screenplay"
    # Captura de pantalla en cada acción: el reporte muestra el paso a paso
    take.screenshots = FOR_EACH_ACTION
    use.unique.browser = false
    restart.browser.for.each = scenario
    test.root = co.com.equipo.certificacion.blazedemo
    console.colors = true
    logging = VERBOSE
    report {
        accessibility = true
    }
    requirement {
        types = "epic, feature"
    }
}

# Pausa entre pasos (milisegundos) SOLO para la sustentación.
# Por defecto 0 (F.I.R.S.T. - Fast). Activar con: -Ddemo.delay=2000
demo.delay = 0

# Espera implícita máxima para encontrar elementos (sincronización real, no sleep)
webdriver.wait.for.timeout = 10000
webdriver.timeouts.implicitlywait = 5000

# Navegador visible por defecto. En CI: -Dheadless.mode=true
headless.mode = false

webdriver {
  driver = chrome
  # false: Selenium Manager descarga el chromedriver que corresponde al Chrome instalado
  autodownload = false
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["start-maximized", "test-type", "no-sandbox", "ignore-certificate-errors",
              "disable-popup-blocking", "disable-default-apps", "incognito", "disable-infobars",
              "disable-gpu", "remote-allow-origins=*", "window-size=1440,900"]
    }
  }
}

pages {
    blazedemo = "https://blazedemo.com/"
}
