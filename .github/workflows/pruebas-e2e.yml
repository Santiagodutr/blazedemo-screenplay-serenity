# Ejecuta la batería E2E en modo headless y publica el reporte de Serenity como artefacto.
name: Pruebas E2E BlazeDemo

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: browser-actions/setup-chrome@v1
      - name: Ejecutar suite principal (headless, sin pausas)
        run: |
          chmod +x gradlew
          ./gradlew clean test -Dheadless.mode=true --console=plain
      - name: Publicar reporte Serenity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-serenity
          path: target/site/serenity
